{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Femi Ayeyemi | Software Engineer, Food Safety & QA Specialist{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 antialiased flex flex-col min-h-screen selection:bg-slate-900 selection:text-white">

    <header class="fixed w-full top-0 z-50 bg-gray-50/80 backdrop-blur-md border-b border-gray-200/50 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tighter text-slate-900 hover:text-slate-600 transition">
                Femi<span class="text-slate-400">.</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                <a href="#work" class="hover:text-slate-900 transition">Portfolio</a>
                <a href="#about" class="hover:text-slate-900 transition">About</a>
                <a href="#blog" class="hover:text-slate-900 transition">Blog</a>
                <a href="mailto:femiayeyemi@eden.net.ng" class="px-5 py-2.5 bg-slate-900 text-white rounded-full hover:bg-slate-800 transition shadow-sm">
                    Get in touch
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow pt-28 pb-20">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-200 bg-white">
        <div class="max-w-6xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between text-sm text-slate-500">
            <p>&copy; {% now "Y" %} Femi Ayeyemi. All rights reserved.</p>
            <div class="flex gap-6 mt-4 md:mt-0">
                <a href="https://linkedin.com/in/ayeyoluwafemi" class="hover:text-slate-900 transition">LinkedIn</a>
                <a href="https://github.com/ayeyoluwafemi" class="hover:text-slate-900 transition">GitHub</a>
                <a href="https://twitter.com/femi_ayeyemi" class="hover:text-slate-900 transition">Twitter</a>
            </div>
        </div>
    </footer>

</body>
</html>
